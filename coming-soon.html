<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Coming Soon — Barefoot Gifting</title>
<style>
@font-face{
  font-family:'Atirose';
  src:url('./atirose-vintage-retro-serif-2023-03-09-21-53-13-utc/otf.otf') format('opentype'),
      url('./atirose-vintage-retro-serif-2023-03-09-21-53-13-utc/ttf.ttf') format('truetype');
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'AstridGrotesk';
  src:url('./Astrid.Grotesk.Font/AstridGrotesk-Light.otf') format('opentype');
  font-weight:300;
  font-display:swap;
}
@font-face{
  font-family:'AstridGrotesk';
  src:url('./Astrid.Grotesk.Font/AstridGrotesk-Regular.otf') format('opentype');
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:'AstridGrotesk';
  src:url('./Astrid.Grotesk.Font/AstridGrotesk-Medium.otf') format('opentype');
  font-weight:500;
  font-display:swap;
}
@font-face{
  font-family:'AstridGrotesk';
  src:url('./Astrid.Grotesk.Font/AstridGrotesk-Bold.otf') format('opentype');
  font-weight:700;
  font-display:swap;
}
:root{
  --red:#dd4040;
  --red-d:#c93535;
  --cream:#fff0e3;
  --peach:#ffe9d0;
  --sage:#daeab0;
  --ink:#161616;
  --muted:#726b62;
  --font-h:'Atirose',Georgia,serif;
  --font-b:'AstridGrotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:var(--font-b);
  color:var(--ink);
  background:
    radial-gradient(circle at top left, rgba(218,234,176,.75), transparent 36%),
    radial-gradient(circle at bottom right, rgba(221,64,64,.12), transparent 30%),
    linear-gradient(180deg, #fff7ee 0%, var(--cream) 100%);
}
.page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:32px 20px;
}
.card{
  width:min(720px,100%);
  background:rgba(255,255,255,.76);
  border:1px solid rgba(221,64,64,.12);
  border-radius:32px;
  padding:clamp(32px,6vw,64px);
  text-align:center;
  box-shadow:0 24px 90px rgba(34,27,20,.08);
  backdrop-filter:blur(12px);
}
.logo{
  width:min(240px,58vw);
  margin:0 auto 28px;
}
.eyebrow{
  margin:0 0 12px;
  color:var(--red);
  font-size:12px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-family:var(--font-h);
  font-size:clamp(48px,8vw,92px);
  line-height:.92;
}
.accent{color:var(--red)}
.copy{
  max-width:520px;
  margin:22px auto 0;
  font-size:clamp(18px,2.6vw,24px);
  line-height:1.65;
  color:var(--muted);
}
@media (max-width:640px){
  .card{border-radius:24px;padding:34px 22px}
  .copy{font-size:17px}
}
</style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Website coming soon">
      <img class="logo" src="./Png Files/Artboard 1 copy 10@2x.png" alt="Barefoot Gifting">
      <p class="eyebrow">Barefoot Gifting</p>
      <h1>Website <span class="accent">Coming Soon</span></h1>
      <p class="copy">We’re putting the final thoughtful touches in place. Please check back soon.</p>
    </section>
  </main>
</body>
</html>
